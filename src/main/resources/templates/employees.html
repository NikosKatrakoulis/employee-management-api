<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Employee</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<nav th:replace="~{fragments/navbar :: navbar}"></nav>

<div class="container mt-4">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h2>Employees</h2>
    <a th:href="@{/employees/new}" class="btn btn-primary" sec:authorize="hasRole('ADMIN')">
      + Create Employee
    </a>
  </div>

  <table class="table table-striped table-hover">
    <thead>
    <tr>
      <th>First Name</th>
      <th>Last Name</th>
      <th>Email</th>
      <th>Department</th>
      <th>Salary</th>
      <th sec:authorize="hasRole('ADMIN')">Actions</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="employee : ${employees}">
      <td th:text="${employee.firstName}"></td>
      <td th:text="${employee.lastName}"></td>
      <td th:text="${employee.email}"></td>
      <td th:text="${employee.departmentName}"></td>
      <td th:text="${employee.salary}"></td>
      <td sec:authorize="hasRole('ADMIN')">
        <a th:href="@{/employees/{id}/edit(id=${employee.id})" class="btn btn-sm btn-outline-secondary">Edit</a>
        <form th:action="@{/employees/{id}/delete(id=${employee.id})" method="post" style="display: inline;">
          <button type="submit" class="btn btn-sm btn-outline-danger"
                  onclick="return confirm('Are you sure')">
            Delete
          </button>
        </form>
      </td>
    </tr>
    </tbody>
  </table>
</div>

</body>
</html>
